        header { background-color: #161e2e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1f293d; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #38bdf8; }
        .header-left span { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .wallet-box { background-color: #0b0f19; padding: 6px 14px; border-radius: 20px; border: 1px solid #38bdf8; font-size: 14px; color: #38bdf8; font-weight: bold; }
        
        .game-container { max-width: 500px; margin: 15px auto; padding: 10px; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: bold; }
        
        .history-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; margin-bottom: 12px; white-space: nowrap; }
        .history-pill { background: #161e2e; border: 1px solid #334155; padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #38bdf8; text-align: center; display: inline-block; min-width: 70px; }
        .history-pill span { display: block; font-size: 13px; color: #4ade80; }

        .game-screen { background: linear-gradient(135deg, #161e2e, #1e1b4b); border: 1px solid #334155; border-radius: 16px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        .multiplier-display { font-size: 50px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.6); z-index: 2; }
        .multiplier-display.crashed { color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }

        .status-text { font-size: 14px; color: #94a3b8; margin-top: 5px; font-weight: bold; z-index: 2; text-transform: uppercase; letter-spacing: 1px; }
        
        .plane-icon { position: absolute; font-size: 32px; color: #f59e0b; bottom: 30px; left: 20px; z-index: 3; display: none; will-change: transform; filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.9)); transition: transform 0.05s linear; }

        .betting-panel { background-color: #161e2e; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .input-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .bet-input { flex: 1; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 16px; font-weight: bold; outline: none; }
        .quick-btn-row { display: flex; gap: 5px; margin-bottom: 15px; }
        .quick-btn { flex: 1; background: #0b0f19; border: 1px solid #334155; color: #cbd5e1; padding: 6px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-cashout { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0b0f19; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161e2e; display: flex; justify-content: space-around; padding: 14px 0; border-top: 2px solid #1f293d; z-index: 50; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: bold; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo">
        <span>SkyNova Aviator</span>
    </div>
    <div class="wallet-box">Bal: ₹<span id="userBalance">326.10</span></div>
</header>

<div class="game-container">
    <div class="info-bar">
        <span>Period: <b id="periodNumber" style="color: #38bdf8;">2097610001</b></span>
        <span>History:</span>
    </div>
    <div class="history-bar" id="historyBar"></div>

    <div class="game-screen">
        <div id="multiplier" class="multiplier-display">1.00x</div>
        <div id="gameStatus" class="status-text">Waiting for next round...</div>
        <i id="plane" class="fa-solid fa-plane-up plane-icon"></i>
    </div>

    <div class="betting-panel">
        <div class="input-group">
            <input type="number" id="betAmount" class="bet-input" value="100" min="10">
        </div>
        <div class="quick-btn-row">
            <button class="quick-btn" onclick="setBet(50)">+50</button>
            <button class="quick-btn" onclick="setBet(100)">+100</button>
            <button class="quick-btn" onclick="setBet(500)">+500</button>
            <button class="quick-btn" onclick="setBet(1000)">+1000</button>
        </div>
        <!-- Main Action Button with dynamic state handling -->
        <button id="actionBtn" class="action-btn btn-bet" onclick="handleMainAction()">PLACE BET</button>
    </div>
</div>

<div class="navbar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
    <a href="refer.html" class="nav-item"><i class="fa-solid fa-gift"></i> Refer & Earn</a>
    <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i> Account</a>
</div>

<script>
    const BIN_ID = "6a956b28f5f4af5e29579654";
    const API_KEY = "$2a$10$NlG72U8qTFJlqXuI46qkm.GIULbWkTOFL0QznU4GCT0ypt9I5Icy6";

    let balance = parseFloat(localStorage.getItem('skynova_balance') || '326.10');
    let uid = localStorage.getItem('skynova_uid') || '794973';
    document.getElementById('userBalance').innerText = balance.toFixed(2);

    let betState = 'NONE'; // 'NONE', 'PLACED', 'PLAYING', 'CASHED_OUT'
    let activeBetAmount = 0;
    let historyList = JSON.parse(localStorage.getItem('skynova_game_history_detailed') || '[]');
    let cloudPeriodCrashes = {};
    let lastProcessedPeriod = 0;
    let currentPhase = 'WAITING'; // 'WAITING' or 'FLYING'

    updateHistoryUI();

    async function fetchCloudData() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY, 'Cache-Control': 'no-cache' }
            });
            let json = await res.json();
            cloudPeriodCrashes = json.record.periodCrashes || {};
        } catch(e) {}
    }

    function setBet(amount) {
        let current = parseFloat(document.getElementById('betAmount').value || 0);
        document.getElementById('betAmount').value = current + amount;
    }

    function updateBalance(newBal) {
        balance = newBal;
        localStorage.setItem('skynova_balance', balance.toFixed(2));
        document.getElementById('userBalance').innerText = balance.toFixed(2);
    }

    function updateHistoryUI() {
        let bar = document.getElementById('historyBar');
        bar.innerHTML = historyList.map(h => `<div class="history-pill">${h.period}<br><span>${h.mult}</span></div>`).join('');
    }

    async function pushBetToCloud(amount) {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;
            if(!data.bets) data.bets = [];
            data.bets.push({ uid: uid, amount: amount, panel: 1, status: 'Active' });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
        } catch(e) {}
    }

    async function clearCloudBets() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;
            data.bets = [];

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
        } catch(e) {}
    }

    // Unified Button Controller
    function handleMainAction() {
        let btn = document.getElementById('actionBtn');

        if (currentPhase === 'WAITING') {
            // Place Bet Action during waiting phase
            let amount = parseFloat(document.getElementById('betAmount').value);
            if(isNaN(amount) || amount <= 0) { alert("Valid amount dalein!"); return; }

            if(balance < amount) { alert("Balance kam hai!"); return; }

            updateBalance(balance - amount);
            activeBetAmount = amount;
            betState = 'PLACED';

            btn.innerText = "WAITING FOR NEXT ROUND";
            btn.className = "action-btn";
            btn.style.background = "#64748b";
            btn.disabled = true;

            pushBetToCloud(amount);
        } 
        else if (currentPhase === 'FLYING' && betState === 'PLACED') {
            // Cash Out Action during flight phase
            let multText = document.getElementById('multiplier').innerText;
            let currentMult = parseFloat(multText);
            
            let winAmount = activeBetAmount * currentMult;
            updateBalance(balance + winAmount);
            betState = 'CASHED_OUT';

            btn.innerText = `CASHED OUT ₹${winAmount.toFixed(2)}`;
            btn.className = "action-btn";
            btn.style.background = "#3b82f6";
            btn.disabled = true;

            alert(`Badhai ho! ₹${winAmount.toFixed(2)} jeet liye! (${currentMult}x)`);
            clearCloudBets();
        }
    }

    function updateButtonUI() {
        let btn = document.getElementById('actionBtn');

        if (currentPhase === 'WAITING') {
            if (betState === 'PLACED') {
                btn.innerText = "WAITING FOR ROUND";
                btn.className = "action-btn";
                btn.style.background = "#64748b";
                btn.disabled = true;
            } else {
                btn.innerText = "PLACE BET";
                btn.className = "action-btn btn-bet";
                btn.style.background = "";
                btn.disabled = false;
            }
        } 
        else if (currentPhase === 'FLYING') {
            if (betState === 'PLACED') {
                btn.innerText = "CASH OUT";
                btn.className = "action-btn btn-cashout";
                btn.style.background = "";
                btn.disabled = false;
            } else if (betState === 'CASHED_OUT') {
                btn.innerText = "CASHED OUT";
                btn.className = "action-btn";
                btn.style.background = "#3b82f6";
                btn.disabled = true;
            } else {
                btn.innerText = "STARTED";
                btn.className = "action-btn";
                btn.style.background = "#475569";
                btn.disabled = true;
            }
        }
    }

    function initGameEngine() {
        const WAIT_TIME = 13; 
        const FLIGHT_TIME = 12; 
        const TOTAL_CYCLE = WAIT_TIME + FLIGHT_TIME;

        setInterval(async () => {
            await fetchCloudData();

            let nowSec = Math.floor(Date.now() / 1000);
            let cycleTime = nowSec % TOTAL_CYCLE;
            let periodId = 2097610000 + Math.floor(nowSec / TOTAL_CYCLE);
            document.getElementById('periodNumber').innerText = periodId;

            let multEl = document.getElementById('multiplier');
            let statusEl = document.getElementById('gameStatus');
            let plane = document.getElementById('plane');

            if (cycleTime < WAIT_TIME) {
                // WAITING PHASE
                currentPhase = 'WAITING';
                multEl.innerText = "1.00x";
                multEl.classList.remove('crashed');
                plane.style.display = 'none';
                
                let timeLeft = WAIT_TIME - cycleTime;
                statusEl.innerText = `Next round starts in ${timeLeft}s...`;

                if (cycleTime === 0) {
                    if (betState === 'CASHED_OUT' || betState === 'PLACED') {
                        betState = 'NONE';
                    }
                }
                updateButtonUI();

            } else {
                // FLIGHT PHASE
                currentPhase = 'FLYING';
                if (plane.style.display !== 'block') {
                    plane.style.display = 'block';
                    statusEl.innerText = "Fly away!";
                }

                updateButtonUI();

                let flightElapsed = cycleTime - WAIT_TIME;
                let currentMult = 1.00 + (flightElapsed * 0.35);

                let targetCrash = cloudPeriodCrashes[periodId.toString()] || cloudPeriodCrashes[periodId];
                if (!targetCrash) {
                    let seed = periodId * 9301 + 49297;
                    let randomVal = (seed % 700) / 100;
                    targetCrash = parseFloat((1.20 + randomVal).toFixed(2));
                }

                if (currentMult >= targetCrash || flightElapsed >= (FLIGHT_TIME - 0.5)) {
                    currentMult = targetCrash;
                }

                multEl.innerText = currentMult.toFixed(2) + 'x';

                let xPos = 20 + (flightElapsed * 18);
                let yPos = Math.pow(flightElapsed, 1.3) * 16;
                if (xPos > 240) xPos = 240;
                if (yPos > 120) yPos = 120;
                plane.style.transform = `translate(${xPos}px, -${yPos}px) rotate(${22 - (flightElapsed * 1.2)}deg)`;

                if (currentMult >= targetCrash && lastProcessedPeriod !== periodId) {
                    lastProcessedPeriod = periodId;
                    triggerCrash(targetCrash, periodId);
                }
            }

        }, 30);
    }

    function triggerCrash(crashVal, currentPeriodId) {
        let multEl = document.getElementById('multiplier');
        multEl.innerText = crashVal.toFixed(2) + 'x';
        multEl.classList.add('crashed');
        
        let statusEl = document.getElementById('gameStatus');
        statusEl.innerText = "CRASHED!";
        document.getElementById('plane').style.display = 'none';

        let finalStr = crashVal.toFixed(2) + 'x';
        
        if (!historyList.some(h => h.period == currentPeriodId)) {
            historyList.unshift({ period: currentPeriodId, mult: finalStr });
            if(historyList.length > 10) historyList.pop();
            localStorage.setItem('skynova_game_history_detailed', JSON.stringify(historyList));
            updateHistoryUI();
        }

        if(betState === 'PLACED') {
            betState = 'NONE';
            alert("Aapka bet haar gaya! Rocket crash ho gaya.");
        }

        clearCloudBets();
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchCloudData();
        initGameEngine();
    });
</script>
</body>

            });
            let json = await res.json();
            let data = json.record;
            data.bets = [];

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });
        } catch(e) {}
    }

    // Unified Button Controller
    function handleMainAction() {
        let btn = document.getElementById('actionBtn');

        if (currentPhase === 'WAITING') {
            // Place Bet Action during waiting phase
            let amount = parseFloat(document.getElementById('betAmount').value);
            if(isNaN(amount) || amount <= 0) { alert("Valid amount dalein!"); return; }

            if(balance < amount) { alert("Balance kam hai!"); return; }

            updateBalance(balance - amount);
            activeBetAmount = amount;
            betState = 'PLACED';

            btn.innerText = "WAITING FOR NEXT ROUND";
            btn.className = "action-btn";
            btn.style.background = "#64748b";
            btn.disabled = true;

            pushBetToCloud(amount);
        } 
        else if (currentPhase === 'FLYING' && betState === 'PLACED') {
            // Cash Out Action during flight phase
            let multText = document.getElementById('multiplier').innerText;
            let currentMult = parseFloat(multText);
            
            let winAmount = activeBetAmount * currentMult;
            updateBalance(balance + winAmount);
            betState = 'CASHED_OUT';

            btn.innerText = `CASHED OUT ₹${winAmount.toFixed(2)}`;
            btn.className = "action-btn";
            btn.style.background = "#3b82f6";
            btn.disabled = true;

            alert(`Badhai ho! ₹${winAmount.toFixed(2)} jeet liye! (${currentMult}x)`);
            clearCloudBets();
        }
    }

    function updateButtonUI() {
        let btn = document.getElementById('actionBtn');

        if (currentPhase === 'WAITING') {
            if (betState === 'PLACED') {
                btn.innerText = "WAITING FOR ROUND";
                btn.className = "action-btn";
                btn.style.background = "#64748b";
                btn.disabled = true;
            } else {
                btn.innerText = "PLACE BET";
                btn.className = "action-btn btn-bet";
                btn.style.background = "";
                btn.disabled = false;
            }
        } 
        else if (currentPhase === 'FLYING') {
            if (betState === 'PLACED') {
                btn.innerText = "CASH OUT";
                btn.className = "action-btn btn-cashout";
                btn.style.background = "";
                btn.disabled = false;
            } else if (betState === 'CASHED_OUT') {
                btn.innerText = "CASHED OUT";
                btn.className = "action-btn";
                btn.style.background = "#3b82f6";
                btn.disabled = true;
            } else {
                btn.innerText = "STARTED";
                btn.className = "action-btn";
                btn.style.background = "#475569";
                btn.disabled = true;
            }
        }
    }

    function initGameEngine() {
        const WAIT_TIME = 13; 
        const FLIGHT_TIME = 12; 
        const TOTAL_CYCLE = WAIT_TIME + FLIGHT_TIME;

        setInterval(async () => {
            await fetchCloudData();

            let nowSec = Math.floor(Date.now() / 1000);
            let cycleTime = nowSec % TOTAL_CYCLE;
            let periodId = 2097610000 + Math.floor(nowSec / TOTAL_CYCLE);
            document.getElementById('periodNumber').innerText = periodId;

            let multEl = document.getElementById('multiplier');
            let statusEl = document.getElementById('gameStatus');
            let plane = document.getElementById('plane');

            if (cycleTime < WAIT_TIME) {
                // WAITING PHASE
                currentPhase = 'WAITING';
                multEl.innerText = "1.00x";
                multEl.classList.remove('crashed');
                plane.style.display = 'none';
                
                let timeLeft = WAIT_TIME - cycleTime;
                statusEl.innerText = `Next round starts in ${timeLeft}s...`;

                if (cycleTime === 0) {
                    if (betState === 'CASHED_OUT' || betState === 'PLACED') {
                        betState = 'NONE';
                    }
                }
                updateButtonUI();

            } else {
                // FLIGHT PHASE
                currentPhase = 'FLYING';
                if (plane.style.display !== 'block') {
                    plane.style.display = 'block';
                    statusEl.innerText = "Fly away!";
                }

                updateButtonUI();

                let flightElapsed = cycleTime - WAIT_TIME;
                let currentMult = 1.00 + (flightElapsed * 0.35);

                let targetCrash = cloudPeriodCrashes[periodId.toString()] || cloudPeriodCrashes[periodId];
                if (!targetCrash) {
                    let seed = periodId * 9301 + 49297;
                    let randomVal = (seed % 700) / 100;
                    targetCrash = parseFloat((1.20 + randomVal).toFixed(2));
                }

                if (currentMult >= targetCrash || flightElapsed >= (FLIGHT_TIME - 0.5)) {
                    currentMult = targetCrash;
                }

                multEl.innerText = currentMult.toFixed(2) + 'x';

                let xPos = 20 + (flightElapsed * 18);
                let yPos = Math.pow(flightElapsed, 1.3) * 16;
                if (xPos > 240) xPos = 240;
                if (yPos > 120) yPos = 120;
                plane.style.transform = `translate(${xPos}px, -${yPos}px) rotate(${22 - (flightElapsed * 1.2)}deg)`;

                if (currentMult >= targetCrash && lastProcessedPeriod !== periodId) {
                    lastProcessedPeriod = periodId;
                    triggerCrash(targetCrash, periodId);
                }
            }

        }, 30);
    }

    function triggerCrash(crashVal, currentPeriodId) {
        let multEl = document.getElementById('multiplier');
        multEl.innerText = crashVal.toFixed(2) + 'x';
        multEl.classList.add('crashed');
        
        let statusEl = document.getElementById('gameStatus');
        statusEl.innerText = "CRASHED!";
        document.getElementById('plane').style.display = 'none';

        let finalStr = crashVal.toFixed(2) + 'x';
        
        if (!historyList.some(h => h.period == currentPeriodId)) {
            historyList.unshift({ period: currentPeriodId, mult: finalStr });
            if(historyList.length > 10) historyList.pop();
            localStorage.setItem('skynova_game_history_detailed', JSON.stringify(historyList));
            updateHistoryUI();
        }

        if(betState === 'PLACED') {
            betState = 'NONE';
            alert("Aapka bet haar gaya! Rocket crash ho gaya.");
        }

        clearCloudBets();
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchCloudData();
        initGameEngine();
    });
</script>
