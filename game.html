<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Aviator Pro</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 20px; }
        header { background-color: #161e2e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; }
        .brand { font-size: 20px; font-weight: bold; color: #e11d48; font-style: italic; }
        .wallet-box { background-color: #0b0f19; padding: 6px 12px; border-radius: 20px; border: 1px solid #38bdf8; font-size: 14px; color: #38bdf8; font-weight: bold; }
        .period-bar { background-color: #0f172a; padding: 6px 15px; font-size: 13px; color: #38bdf8; font-weight: bold; border-bottom: 1px solid #1f293d; display: flex; justify-content: space-between; }
        .history-bar { background-color: #111827; padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid #1f293d; white-space: nowrap; }
        .history-chip { background-color: #1f293d; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #4ade80; text-align: center; min-width: 75px; flex-shrink: 0; }
        .history-chip span { display: block; font-size: 10px; color: #94a3b8; }
        .game-container { max-width: 500px; margin: 10px auto; padding: 10px; }
        .plane-screen { height: 200px; background: linear-gradient(135deg, #0f172a, #1e1b4b); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #334155; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
        #multiplier { font-size: 48px; font-weight: bold; color: #ffffff; }
        .game-status { font-size: 15px; color: #94a3b8; margin-top: 5px; font-weight: bold; }
        .bet-panel { background-color: #161e2e; border-radius: 10px; padding: 12px; margin-top: 10px; border: 1px solid #1f293d; }
        .bet-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .input-group { display: flex; align-items: center; background-color: #0b0f19; border: 1px solid #334155; border-radius: 8px; overflow: hidden; width: 100%; }
        .input-group input { width: 100%; background: transparent; border: none; color: #fff; text-align: center; font-size: 16px; padding: 10px 0; outline: none; }
        .quick-btns { display: flex; gap: 5px; margin-top: 8px; }
        .quick-btn { background-color: #1f293d; color: #cbd5e1; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .action-btn { width: 52%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background-color: #22c55e; color: #ffffff; }
        .btn-cancel { background-color: #eab308; color: #000000; }
        .btn-cashout { background-color: #ef4444; color: #ffffff; }
    </style>
</head>
<body>

<header>
    <a href="home.html" style="color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: bold;">⬅ Back</a>
    <div class="brand">Aviator</div>
    <div class="wallet-box">₹<span id="userBalance">69.00</span></div>
</header>

<div class="period-bar">
    <span>Period ID: <strong id="currentPeriodDisplay">Loading...</strong></span>
    <span style="color: #4ade80;">Live</span>
</div>

<div class="history-bar" id="historyBar"></div>

<div class="game-container">
    <div class="plane-screen">
        <div id="multiplier">1.00x</div>
        <div class="game-status" id="gameStatus">Waiting...</div>
    </div>

    <!-- Bet Panel 1 -->
    <div class="bet-panel">
        <div class="bet-row">
            <div style="width: 46%;">
                <div class="input-group">
                    <input type="number" id="bet1Amount" value="10">
                </div>
                <div class="quick-btns">
                    <button class="quick-btn" onclick="setBet(1, 10)">10</button>
                    <button class="quick-btn" onclick="setBet(1, 50)">50</button>
                    <button class="quick-btn" onclick="setBet(1, 100)">100</button>
                </div>
            </div>
            <button class="action-btn btn-bet" id="btn1" onclick="handleBet(1)">BET</button>
        </div>
    </div>
</div>

<script>
    function getBalance() {
        return parseFloat(localStorage.getItem('skynova_balance') || '69.00');
    }
    function setBalance(val) {
        localStorage.setItem('skynova_balance', val.toFixed(2));
        updateUI();
    }

    let bet1State = 0;
    let bet1Amt = 0;
    let currentMultiplier = 1.00;
    let serverCrashOverride = null;

    const WAIT_DURATION = 13000;
    const FLIGHT_DURATION = 10000;
    const CRASH_HOLD_DURATION = 3000;
    const ROUND_DURATION = WAIT_DURATION + FLIGHT_DURATION + CRASH_HOLD_DURATION;

    let lastRecordedPeriod = null;

    function updateUI() {
        document.getElementById('userBalance').innerText = getBalance().toFixed(2);
    }

    function setBet(panel, val) {
        document.getElementById(`bet${panel}Amount`).value = val;
    }

    async function fetchServerCrashOverride() {
        try {
            let response = await fetch('/api/get-crash');
            let data = await response.json();
            serverCrashOverride = data.crash;
        } catch (err) {
            console.error("Server crash fetch error:", err);
        }
    }

    setInterval(fetchServerCrashOverride, 2000);

    updateUI();
    fetchServerCrashOverride();

    setInterval(() => {
        let nowTimestamp = Date.now();
        let cycleTime = nowTimestamp % ROUND_DURATION;
        let epochRounds = Math.floor(nowTimestamp / ROUND_DURATION);
        
        let currentPeriod = 202600000000 + epochRounds;
        document.getElementById('currentPeriodDisplay').innerText = currentPeriod;

        let seed = Math.sin(epochRounds) * 10000;
        let naturalCrashPoint = 1.20 + (Math.abs(seed - Math.floor(seed)) * 8.0);
        let roundCrashPoint = (serverCrashOverride !== null && !isNaN(serverCrashOverride)) ? parseFloat(serverCrashOverride) : naturalCrashPoint;

        if (cycleTime < WAIT_DURATION) {
            let timeLeft = (WAIT_DURATION - cycleTime) / 1000;
            document.getElementById('multiplier').innerText = "1.00x";
            document.getElementById('multiplier').style.color = "#ffffff";
            document.getElementById('gameStatus').innerText = `Agli udaan ${Math.ceil(timeLeft)}s mein...`;
            document.getElementById('gameStatus').style.color = "#38bdf8";

            if (bet1State === 1) bet1State = 2;
            updateButtonUI(1);
        } 
        else if (cycleTime >= WAIT_DURATION && cycleTime < (WAIT_DURATION + FLIGHT_DURATION)) {
            let flightTime = (cycleTime - WAIT_DURATION) / 1000; 
            let progress = flightTime / (FLIGHT_DURATION / 1000);
            
            currentMultiplier = parseFloat((1.00 + (roundCrashPoint - 1.00) * progress).toFixed(2));
            if (currentMultiplier > roundCrashPoint) {
                currentMultiplier = roundCrashPoint;
            }

            document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";
            document.getElementById('multiplier').style.color = "#4ade80"; 
            document.getElementById('gameStatus').innerText = "Plane ud raha hai...";
            document.getElementById('gameStatus').style.color = "#94a3b8";

            updateButtonUI(1);
        } 
        else {
            currentMultiplier = roundCrashPoint;
            document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";
            document.getElementById('multiplier').style.color = "#ef4444"; 
            document.getElementById('gameStatus').innerText = "Crashed!";
            document.getElementById('gameStatus').style.color = "#ef4444"; 

            if (bet1State === 2) bet1State = 4;

            if (cycleTime > (ROUND_DURATION - 500)) {
                if (bet1State === 3 || bet1State === 4) bet1State = 0;
            }

            updateButtonUI(1);
        }
    }, 100);

    function handleBet(panel) {
        let amtInput = parseFloat(document.getElementById(`bet${panel}Amount`).value);
        let state = bet1State;
        let bal = getBalance();
        let nowTimestamp = Date.now();
        let cycleTime = nowTimestamp % ROUND_DURATION;
        let isWaitingPhase = cycleTime < WAIT_DURATION;

        if (state === 0) { 
            if (!isWaitingPhase) {
                alert("Bet sirf waiting time mein lag sakti hai!");
                return;
            }
            if (isNaN(amtInput) || amtInput <= 0 || amtInput > bal) {
                alert("Sahi amount dalein ya balance check karein!");
                return;
            }
            bal -= amtInput;
            setBalance(bal);
            bet1Amt = amtInput; 
            bet1State = 1;
            updateButtonUI(1);
        } 
        else if (state === 1 && isWaitingPhase) { 
            bal += bet1Amt;
            setBalance(bal);
            bet1State = 0;
            updateButtonUI(1);
        } 
        else if (state === 2 && isWaitingPhase === false && cycleTime < (WAIT_DURATION + FLIGHT_DURATION)) { 
            let win = bet1Amt * currentMultiplier;
            bal += win;
            setBalance(bal);
            bet1State = 3;
            updateButtonUI(1);
            alert(`Badhai ho! Jeet liye ₹${win.toFixed(2)} (${currentMultiplier.toFixed(2)}x)`);
        }
    }

    function updateButtonUI(panel) {
        let btn = document.getElementById(`btn1`);
        let nowTimestamp = Date.now();
        let cycleTime = nowTimestamp % ROUND_DURATION;
        let isWaitingPhase = cycleTime < WAIT_DURATION;

        if (isWaitingPhase) {
            if (bet1State === 1 || bet1State === 2) {
                btn.innerText = "CANCEL";
                btn.className = "action-btn btn-cancel";
            } else {
                btn.innerText = "BET";
                btn.className = "action-btn btn-bet";
            }
        } else if (cycleTime < (WAIT_DURATION + FLIGHT_DURATION)) {
            if (bet1State === 2) {
                btn.innerText = "CASH OUT";
                btn.className = "action-btn btn-cashout";
            } else if (bet1State === 3) {
                btn.innerText = "WON";
                btn.className = "action-btn btn-bet";
            } else if (bet1State === 4) {
                btn.innerText = "CRASHED";
                btn.className = "action-btn btn-cancel";
            } else {
                btn.innerText = "WAIT";
                btn.className = "action-btn btn-bet";
            }
        } else {
            btn.innerText = "CRASHED";
            btn.className = "action-btn btn-cancel";
        }
    }
</script>
</body>
</html>
