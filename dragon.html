<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Dragon vs Tiger</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 90px; user-select: none; }
        header { background-color: #161e2e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1f293d; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left span { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .wallet-box { background-color: #0b0f19; padding: 6px 14px; border-radius: 20px; border: 1px solid #38bdf8; font-size: 14px; color: #38bdf8; font-weight: bold; }
        
        .game-container { max-width: 500px; margin: 15px auto; padding: 10px; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; color: #94a3b8; font-weight: bold; }
        
        .battle-screen { background: linear-gradient(135deg, #161e2e, #1e1b4b); border: 1px solid #334155; border-radius: 16px; height: 220px; display: flex; justify-content: space-around; align-items: center; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.6); padding: 10px; }
        .card-box { width: 120px; height: 160px; background: #0b0f19; border: 2px solid #334155; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
        .dragon-side { color: #ef4444; border-color: #ef4444; }
        .tiger-side { color: #38bdf8; border-color: #38bdf8; }
        .vs-text { font-size: 22px; font-weight: bold; color: #f59e0b; text-transform: uppercase; }
        
        .status-banner { text-align: center; font-size: 15px; font-weight: bold; color: #fbbf24; margin: 12px 0; }

        .betting-panel { background-color: #161e2e; border: 1px solid #334155; border-radius: 16px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .bet-choices { display: flex; gap: 10px; margin-bottom: 15px; }
        .choice-btn { flex: 1; padding: 15px; border: 2px solid #334155; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; color: #fff; background: #0b0f19; text-align: center; }
        .choice-btn.dragon { border-color: #ef4444; }
        .choice-btn.dragon.selected { background: #ef4444; color: #fff; }
        .choice-btn.tiger { border-color: #38bdf8; }
        .choice-btn.tiger.selected { background: #38bdf8; color: #0b0f19; }
        .choice-btn.tie { border-color: #22c55e; }
        .choice-btn.tie.selected { background: #22c55e; color: #fff; }

        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .bet-input { flex: 1; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 16px; font-weight: bold; outline: none; }
        .quick-btn-row { display: flex; gap: 5px; margin-bottom: 15px; }
        .quick-btn { flex: 1; background: #0b0f19; border: 1px solid #334155; color: #cbd5e1; padding: 6px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        .action-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161e2e; display: flex; justify-content: space-around; padding: 14px 0; border-top: 2px solid #1f293d; z-index: 50; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: bold; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span>Dragon vs Tiger</span>
    </div>
    <div class="wallet-box">Bal: ₹<span id="userBalance">326.10</span></div>
</header>

<div class="game-container">
    <div class="info-bar">
        <span>Period: <b id="periodNumber" style="color: #38bdf8;">2097610001</b></span>
    </div>

    <div class="battle-screen">
        <div class="card-box dragon-side">
            <div style="font-size: 12px; margin-bottom: 5px;">DRAGON</div>
            <div id="dragonCard">?</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="card-box tiger-side">
            <div style="font-size: 12px; margin-bottom: 5px;">TIGER</div>
            <div id="tigerCard">?</div>
        </div>
    </div>

    <div class="status-text status-banner" id="gameStatus">Waiting for round...</div>

    <div class="betting-panel">
        <div class="bet-choices">
            <button class="choice-btn dragon" id="btnDragon" onclick="selectChoice('Dragon')">Dragon (2x)</button>
            <button class="choice-btn tie" id="btnTie" onclick="selectChoice('Tie')">Tie (8x)</button>
            <button class="choice-btn tiger" id="btnTiger" onclick="selectChoice('Tiger')">Tiger (2x)</button>
        </div>

        <div class="input-group">
            <input type="number" id="betAmount" class="bet-input" value="100" min="10">
        </div>
        <div class="quick-btn-row">
            <button class="quick-btn" onclick="setBet(50)">+50</button>
            <button class="quick-btn" onclick="setBet(100)">+100</button>
            <button class="quick-btn" onclick="setBet(500)">+500</button>
            <button class="quick-btn" onclick="setBet(1000)">+1000</button>
        </div>
        <button id="actionBtn" class="action-btn" onclick="placeBet()">PLACE BET</button>
    </div>
</div>

<div class="navbar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
    <a href="refer.html" class="nav-item"><i class="fa-solid fa-gift"></i> Refer & Earn</a>
    <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i> Account</a>
</div>

<script>
    const BIN_ID = "6a956b28f5f4af5e29579654";
    const API_KEY = "$2a$10$NlG72U8qTFJlqXuI46qkm.GIULbWkTOFL0QznU4GCT0ypt9I5Icy6";

    let balance = parseFloat(localStorage.getItem('skynova_balance') || '326.10');
    let uid = localStorage.getItem('skynova_uid') || '794973';
    document.getElementById('userBalance').innerText = balance.toFixed(2);

    let selectedChoice = '';
    let betPlaced = false;
    let bettingAllowed = true;
    let cloudDragonSettings = {};

    async function fetchDragonCloud() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY, 'Cache-Control': 'no-cache' }
            });
            let json = await res.json();
            cloudDragonSettings = json.record.dragonSettings || {};
        } catch(e) {}
    }

    function setBet(amount) {
        let current = parseFloat(document.getElementById('betAmount').value || 0);
        document.getElementById('betAmount').value = current + amount;
    }

    function updateBalance(newBal) {
        balance = newBal;
        localStorage.setItem('skynova_balance', balance.toFixed(2));
        document.getElementById('userBalance').innerText = balance.toFixed(2);
    }

    function selectChoice(choice) {
        if(!bettingAllowed || betPlaced) return;
        selectedChoice = choice;
        document.getElementById('btnDragon').className = "choice-btn dragon" + (choice === 'Dragon' ? ' selected' : '');
        document.getElementById('btnTie').className = "choice-btn tie" + (choice === 'Tie' ? ' selected' : '');
        document.getElementById('btnTiger').className = "choice-btn tiger" + (choice === 'Tiger' ? ' selected' : '');
    }

    function placeBet() {
        if(!bettingAllowed) { alert("Betting band ho chuki hai (Last 10 seconds remaining)!"); return; }
        if(!selectedChoice) { alert("Kripya Dragon, Tiger ya Tie chunein!"); return; }
        let amount = parseFloat(document.getElementById('betAmount').value);
        if(isNaN(amount) || amount <= 0) { alert("Valid amount dalein!"); return; }

        if(balance < amount) { alert("Balance kam hai!"); return; }

        updateBalance(balance - amount);
        betPlaced = true;
        let btn = document.getElementById('actionBtn');
        btn.innerText = "BET PLACED (" + selectedChoice + ")";
        btn.style.background = "#64748b";
        btn.disabled = true;
    }

    // 70 seconds total cycle: 60s betting time + 10s result/lock time
    function initDragonGame() {
        const BET_TIME = 60; 
        const TOTAL_CYCLE = 70;

        setInterval(async () => {
            await fetchDragonCloud();

            let nowSec = Math.floor(Date.now() / 1000);
            let cycleTime = nowSec % TOTAL_CYCLE;
            let periodId = 3097610000 + Math.floor(nowSec / TOTAL_CYCLE);
            document.getElementById('periodNumber').innerText = periodId;

            let statusEl = document.getElementById('gameStatus');
            let dragonCard = document.getElementById('dragonCard');
            let tigerCard = document.getElementById('tigerCard');
            let actionBtn = document.getElementById('actionBtn');

            if (cycleTime < BET_TIME) {
                // 60 seconds betting phase
                let timeLeft = BET_TIME - cycleTime;
                
                if (timeLeft <= 10) {
                    bettingAllowed = false;
                    statusEl.innerText = `Betting Closed! Result in ${timeLeft}s`;
                    actionBtn.style.background = "#475569";
                    actionBtn.disabled = true;
                } else {
                    bettingAllowed = true;
                    statusEl.innerText = `Place your bets! Time left: ${timeLeft}s`;
                }

                dragonCard.innerText = "?";
                tigerCard.innerText = "?";

                if (cycleTime === 0) {
                    betPlaced = false;
                    selectedChoice = '';
                    actionBtn.innerText = "PLACE BET";
                    actionBtn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
                    actionBtn.disabled = false;
                    selectChoice('');
                }

            } else {
                // Last 10 seconds result reveal phase
                bettingAllowed = false;
                statusEl.innerText = "Revealing Cards...";
                
                // Admin control check or natural random winner
                let forcedWinner = cloudDragonSettings[periodId.toString()] || cloudDragonSettings[periodId];
                
                let dCardVal, tCardVal;
                if (forcedWinner === 'Dragon') {
                    dCardVal = 13; tCardVal = 5;
                } else if (forcedWinner === 'Tiger') {
                    dCardVal = 4; tCardVal = 12;
                } else if (forcedWinner === 'Tie') {
                    dCardVal = 8; tCardVal = 8;
                } else {
                    let seed = periodId * 9301 + 49297;
                    dCardVal = (seed % 13) + 1;
                    tCardVal = ((seed * 3) % 13) + 1;
                }

                let cardNames = {1:'A', 11:'J', 12:'Q', 13:'K'};
                dragonCard.innerText = cardNames[dCardVal] || dCardVal;
                tigerCard.innerText = cardNames[tCardVal] || tCardVal;

                let winner = dCardVal > tCardVal ? 'Dragon' : (tCardVal > dCardVal ? 'Tiger' : 'Tie');
                statusEl.innerText = `Winner: ${winner.toUpperCase()}!`;

                if (betPlaced && lastProcessedPeriod !== periodId) {
                    lastProcessedPeriod = periodId;
                    let betAmt = parseFloat(document.getElementById('betAmount').value);
                    if (selectedChoice === winner) {
                        let multiplier = winner === 'Tie' ? 8 : 2;
                        let winAmt = betAmt * multiplier;
                        updateBalance(balance + winAmt);
                        alert(`Badhai ho! Aap jeet gaye! ₹${winAmt.toFixed(2)} added.`);
                    } else {
                        alert(`Aap haar gaye! Winner ${winner} tha.`);
                    }
                    betPlaced = false;
                }
            }
        }, 1000);
    }

    let lastProcessedPeriod = 0;
    window.addEventListener('DOMContentLoaded', () => {
        initDragonGame();
    });
</script>
</body>
</html>
