<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Refer & Earn</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 90px; }
        header { background-color: #161e2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; }
        .brand { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .container { max-width: 500px; margin: 15px auto; padding: 10px; }
        .card { background-color: #161e2e; border: 1px solid #334155; border-radius: 14px; padding: 25px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0b0f19; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 15px; text-transform: uppercase; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161e2e; display: flex; justify-content: space-around; padding: 14px 0; border-top: 2px solid #1f293d; z-index: 50; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: bold; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

<header>
    <div class="brand"><i class="fa-solid fa-gift"></i> Refer & Earn</div>
</header>

<div class="container">
    <div class="card">
        <i class="fa-solid fa-users-rectangle" style="font-size: 45px; color: #38bdf8; margin-bottom: 15px;"></i>
        <h2>Invite Friends & Earn Cash</h2>
        <p style="color: #94a3b8; font-size: 14px;">Share your referral link with friends and get instant bonus when they join and play!</p>
        <button class="btn" onclick="shareReferral()">Share Referral Link</button>
    </div>
</div>

<div class="navbar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
    <a href="refer.html" class="nav-item active"><i class="fa-solid fa-gift"></i> Refer & Earn</a>
    <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i> Account</a>
</div>

<script>
    function shareReferral() {
        let uid = localStorage.getItem('skynova_uid') || '794973';
        let link = `https://skynova-game.vercel.app/home.html?ref=${uid}`;
        if (navigator.share) {
            navigator.share({ title: 'SkyNova Aviator', text: 'Join me and play Aviator!', url: link });
        } else {
            navigator.clipboard.writeText(link);
            alert("Referral link copied to clipboard!");
        }
    }
</script>
</body>
</html>
