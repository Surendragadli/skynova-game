<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Admin Panel</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding: 20px; }
        header { background-color: #161e2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; border-radius: 8px; margin-bottom: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background-color: #161e2e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid #1f293d; margin-bottom: 20px; }
        .section-title { font-size: 16px; color: #38bdf8; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #334155; }
        th { background-color: #1f293d; color: #38bdf8; }
        td { color: #cbd5e1; }
        .btn-approve { background-color: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-reject { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background-color: #161e2e; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .stat-val { font-size: 22px; font-weight: bold; color: #4ade80; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-shield-halved text-2xl text-sky-400"></i>
            <span style="font-size: 18px; font-weight: bold; color: #38bdf8;">SkyNova Admin Panel</span>
        </div>
        <a href="home.html" style="color: #94a3b8; text-decoration: none; font-size: 13px;"><i class="fa-solid fa-arrow-left"></i> Home Par Jayein</a>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div style="font-size: 13px; color: #94a3b8;">System Status</div>
            <div class="stat-val" style="font-size: 16px; color: #38bdf8;">Active (Live Server)</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 13px; color: #94a3b8;">Pending Deposits</div>
            <div class="stat-val" id="pendingDepositsCount" style="color: #f59e0b;">0</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 13px; color: #94a3b8;">Pending Withdrawals</div>
            <div class="stat-val" id="pendingWithdrawalsCount" style="color: #f43f5e;">0</div>
        </div>
    </div>

    <!-- Aviator Crash Control Section -->
    <div class="card">
        <div class="section-title"><i class="fa-solid fa-plane-departure"></i> Aviator Game Multiplier Control (Next Crash)</div>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px;">Agla Crash Point (Multiplier set karein):</label>
                <input type="number" id="nextCrashInput" step="0.01" placeholder="e.g. 6.66" style="width: 100%; background-color: #0b0f19; border: 1px solid #334155; padding: 10px; border-radius: 6px; color: #ffffff; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>
            <div style="margin-top: 18px;">
                <button onclick="setCustomCrash()" class="btn-approve" style="padding: 10px 20px; font-size: 14px;">Set Karein</button>
            </div>
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 10px;" id="currentCrashStatus">Current Manual Override: <span style="color: #f59e0b;">Random (Default)</span></p>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        checkActiveOverride();
    });

    async function setCustomCrash() {
        let crashVal = document.getElementById('nextCrashInput').value;
        if(!crashVal || crashVal < 1.00) {
            alert("Kripya valid multiplier enter karein (e.g. 6.66)");
            return;
        }

        try {
            let response = await fetch('/api/set-crash', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ crashVal: crashVal })
            });
            let result = await response.json();
            if(result.success) {
                document.getElementById('currentCrashStatus').innerHTML = `Current Manual Override: <span style="color: #4ade80; font-weight: bold;">${crashVal}x par crash hoga</span>`;
                alert("Success! Agla round " + crashVal + "x par crash hoga.");
            }
        } catch (err) {
            alert("Server connection error!");
        }
    }

    async function checkActiveOverride() {
        try {
            let response = await fetch('/api/get-crash');
            let data = await response.json();
            if (data.crash) {
                document.getElementById('nextCrashInput').value = data.crash;
                document.getElementById('currentCrashStatus').innerHTML = `Current Manual Override: <span style="color: #4ade80; font-weight: bold;">${data.crash}x par crash hoga</span>`;
            }
        } catch (err) {
            console.error("Could not fetch crash override");
        }
    }
</script>
</body>
</html>
