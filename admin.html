<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Cloud Admin Panel</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 50px; }
        header { background-color: #161e2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; }
        .brand { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .container { max-width: 800px; margin: 15px auto; padding: 10px; }
        .card { background-color: #161e2e; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .form-control { width: 100%; background-color: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: #38bdf8; }
        .btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0b0f19; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background-color: #161e2e; border: 1px solid #334155; border-radius: 10px; padding: 15px; text-align: center; }
        .stat-val { font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 5px; }
        .req-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .req-table th { background-color: #1f293d; color: #38bdf8; padding: 10px; text-align: left; }
        .req-table td { padding: 10px; border-bottom: 1px solid #1f293d; color: #cbd5e1; }
    </style>
</head>
<body>

<header>
    <div class="brand"><i class="fa-solid fa-shield-halved"></i> SkyNova Cloud Admin Panel</div>
    <a href="home.html" style="color: #f59e0b; text-decoration: none; font-size: 14px; font-weight: bold;"><i class="fa-solid fa-house"></i> Home</a>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-box">
            <div style="font-size: 11px; color: #94a3b8;">Total Bet Amount</div>
            <div class="stat-val" id="totalLiveBetAmount">₹0.00</div>
        </div>
        <div class="stat-box">
            <div style="font-size: 11px; color: #94a3b8;">Current Period</div>
            <div class="stat-val" id="adminPeriod" style="color: #38bdf8; font-size: 15px;">-</div>
        </div>
        <div class="stat-box">
            <div style="font-size: 11px; color: #94a3b8;">Cloud Status</div>
            <div class="stat-val" style="color: #34d399; font-size: 14px;">Connected</div>
        </div>
    </div>

    <!-- Crash Point Control -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-plane-departure"></i> Aviator Game Multiplier Control (Cloud Sync)</div>
        <div class="form-group">
            <label>Agla Crash Point Set Karein (e.g. 2.00):</label>
            <input type="number" step="0.01" id="crashInput" class="form-control" placeholder="2.00">
        </div>
        <button class="btn btn-success" onclick="updateCloudCrash()">Cloud Par Set Karein</button>
        <div id="crashStatusMsg" style="font-size: 12px; color: #4ade80; margin-top: 8px; font-weight: bold;"></div>
    </div>

    <!-- Live Game Bets -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-line"></i> Live Game Bets (All Users)</div>
        <div style="overflow-x: auto;">
            <table class="req-table">
                <thead>
                    <tr><th>UID</th><th>Bet Amount</th><th>Panel</th><th>Status</th></tr>
                </thead>
                <tbody id="liveBetsTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #64748b;">Loading live bets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const BIN_ID = "6a954a31f5f4af5e2957120c";
    const API_KEY = "$2a$10$NlG72U8qTFJlqXuI46qkm.GIULbWkTOFL0QznU4GCT0ypt9I5Icy6";

    window.addEventListener('DOMContentLoaded', () => {
        fetchCloudData();
        setInterval(fetchCloudData, 2000); // Har 2 second me live data sync
    });

    async function fetchCloudData() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;

            if(data.crash !== undefined && document.activeElement !== document.getElementById('crashInput')) {
                document.getElementById('crashInput').value = data.crash;
            }

            if(data.period) {
                document.getElementById('adminPeriod').innerText = data.period;
            }

            // Live Bets
            let bets = data.bets || [];
            let totalAmt = 0;
            let betsHtml = '';
            if(bets.length === 0) {
                betsHtml = `<tr><td colspan="4" style="text-align: center; color: #64748b;">Koi live bet nahi hai.</td></tr>`;
            } else {
                bets.forEach(b => {
                    totalAmt += parseFloat(b.amount || 0);
                    betsHtml += `<tr><td><b>${b.uid}</b></td><td style="color:#38bdf8;">₹${b.amount}</td><td>Panel ${b.panel}</td><td style="color:#fbbf24;">Active</td></tr>`;
                });
            }
            document.getElementById('liveBetsTableBody').innerHTML = betsHtml;
            document.getElementById('totalLiveBetAmount').innerText = `₹${totalAmt.toFixed(2)}`;

        } catch(e) {
            console.error("Cloud fetch error:", e);
        }
    }

    async function updateCloudCrash() {
        let val = parseFloat(document.getElementById('crashInput').value);
        if(isNaN(val) || val < 1.00) { alert("Valid multiplier dalein!"); return; }

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;
            data.crash = val;

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });

            if(updateRes.ok) {
                document.getElementById('crashStatusMsg').innerText = `Successfully set to ${val}x!`;
                alert(`Crash point ${val}x cloud par set ho gaya hai! Ab game usi par crash hoga.`);
            }
        } catch(e) {
            alert("Error updating crash: " + e);
        }
    }
</script>
</body>
</html>
