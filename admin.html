<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Admin Panel</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 50px; }
        header { background-color: #161e2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; }
        .brand { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .home-link { color: #f59e0b; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        .container { max-width: 750px; margin: 15px auto; padding: 10px; }
        .card { background-color: #161e2e; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .form-control { width: 100%; background-color: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: #38bdf8; }
        
        .btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0b0f19; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background-color: #161e2e; border: 1px solid #334155; border-radius: 10px; padding: 15px; text-align: center; }
        .stat-val { font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <div class="brand"><i class="fa-solid fa-shield-halved"></i> SkyNova Admin Panel</div>
    <a href="home.html" class="home-link"><i class="fa-solid fa-house"></i> Home Jayein</a>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-box">
            <div style="font-size: 11px; color: #94a3b8;">Status</div>
            <div class="stat-val" style="font-size: 14px; color: #34d399;">Active</div>
        </div>
        <div class="stat-box">
            <div style="font-size: 11px; color: #94a3b8;">Total Bets</div>
            <div class="stat-val" id="totalLiveBetAmount">₹0.00</div>
        </div>
        <div class="stat-box">
            <div style="font-size: 11px; color: #94a3b8;">Active Users</div>
            <div class="stat-val">1</div>
        </div>
    </div>

    <!-- Aviator Crash Point Control -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-plane-departure"></i> Aviator Game Multiplier Control (Next Crash)</div>
        <div class="form-group">
            <label>Agla Crash Point (Multiplier set karein):</label>
            <input type="number" step="0.01" id="crashInput" class="form-control" placeholder="jaise: 2.00 ya 5.50">
        </div>
        <button class="btn btn-success" onclick="setCrashPoint()">Set Karein</button>
        <div id="crashStatusMsg" style="font-size: 12px; color: #4ade80; margin-top: 8px; font-weight: bold;"></div>
    </div>

    <!-- Naya Gift Code Banayein -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-gift"></i> Naya Gift Code Banayein</div>
        <div class="form-group">
            <label>Gift Code Name (jaise: BONUS100):</label>
            <input type="text" id="giftCodeInput" class="form-control" placeholder="CODE NAME">
        </div>
        <div class="form-group">
            <label>Bonus Amount (₹):</label>
            <input type="number" id="giftAmountInput" class="form-control" placeholder="jaise: 100">
        </div>
        <div class="form-group">
            <label>Max Uses (Kitne log use kar sakte hain):</label>
            <input type="number" id="giftMaxUsesInput" class="form-control" value="100">
        </div>
        <button class="btn" onclick="createGiftCode()">Gift Code Banayein</button>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let savedCrash = localStorage.getItem('skynova_admin_crash') || localStorage.getItem('aviator_override_crash');
        if(savedCrash) {
            document.getElementById('crashInput').value = savedCrash;
            document.getElementById('crashStatusMsg').innerText = `Current Override: ${savedCrash}x par crash hoga`;
        }
    });

    function setCrashPoint() {
        let val = document.getElementById('crashInput').value;
        if(!val || isNaN(val) || parseFloat(val) < 1.00) {
            alert("Kripya valid multiplier dalein (1.00 ya zyada)!");
            return;
        }
        let numVal = parseFloat(val).toFixed(2);
        
        // Dono keys me save karein taaki game engine ko turant mil jaye
        localStorage.setItem('skynova_admin_crash', numVal);
        localStorage.setItem('aviator_override_crash', numVal);

        document.getElementById('crashStatusMsg').innerText = `Successfully Set! Next crash at ${numVal}x`;
        alert(`Crash point successfully ${numVal}x set kar diya gaya hai! Ab game usi par crash hoga.`);
    }

    function createGiftCode() {
        let code = document.getElementById('giftCodeInput').value.trim().toUpperCase();
        let amount = parseFloat(document.getElementById('giftAmountInput').value);
        let maxUses = parseInt(document.getElementById('giftMaxUsesInput').value);

        if(!code || isNaN(amount) || amount <= 0 || isNaN(maxUses) || maxUses <= 0) {
            alert("Kripya sabhi fields sahi se bharein!");
            return;
        }

        // Existing codes load karein
        let giftDb = JSON.parse(localStorage.getItem('skynova_gift_codes') || '{}');
        
        giftDb[code] = {
            amount: amount,
            maxUses: maxUses,
            usedCount: 0,
            claimedUsers: []
        };

        localStorage.setItem('skynova_gift_codes', JSON.stringify(giftDb));
        
        document.getElementById('giftCodeInput').value = '';
        document.getElementById('giftAmountInput').value = '';
        alert(`Gift Code '${code}' (₹${amount}) successfully ban gaya hai! Ab user account me jaakar ise claim kar sakte hain.`);
    }
</script>
</body>
</html>
