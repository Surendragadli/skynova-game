<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Account & Wallet</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 90px; }
        header { background-color: #161e2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; }
        .brand { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .container { max-width: 500px; margin: 15px auto; padding: 10px; }
        .card { background-color: #161e2e; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .wallet-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #38bdf8; text-align: center; }
        .balance-val { font-size: 32px; font-weight: bold; color: #4ade80; margin: 10px 0; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .form-control { width: 100%; background-color: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0b0f19; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161e2e; display: flex; justify-content: space-around; padding: 14px 0; border-top: 2px solid #1f293d; z-index: 50; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: bold; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

<header>
    <div class="brand"><i class="fa-solid fa-user"></i> My Account</div>
    <div style="color: #94a3b8; font-size: 13px;">UID: <b id="displayUid" style="color: #38bdf8;">794973</b></div>
</header>

<div class="container">
    <!-- Wallet Card -->
    <div class="card wallet-card">
        <div style="font-size: 14px; color: #94a3b8;">Total Balance</div>
        <div class="balance-val">₹<span id="accountBalance">326.10</span></div>
    </div>

    <!-- Deposit Card -->
    <div class="card">
        <h3><i class="fa-solid fa-wallet" style="color: #4ade80;"></i> Deposit Money</h3>
        <div class="form-group">
            <label>Amount (₹):</label>
            <input type="number" id="depAmount" class="form-control" placeholder="1000">
        </div>
        <div class="form-group">
            <label>UTR / Transaction Reference Number:</label>
            <input type="text" id="depUtr" class="form-control" placeholder="UPI Ref Number">
        </div>
        <button class="btn btn-success" onclick="requestDeposit()">Submit Deposit Request</button>
    </div>

    <!-- Withdrawal Card -->
    <div class="card">
        <h3><i class="fa-solid fa-money-bill-transfer" style="color: #ef4444;"></i> Withdraw Money</h3>
        <div class="form-group">
            <label>Amount (₹):</label>
            <input type="number" id="withAmount" class="form-control" placeholder="500">
        </div>
        <div class="form-group">
            <label>UPI ID / Bank Details:</label>
            <input type="text" id="withDetails" class="form-control" placeholder="username@paytm">
        </div>
        <button class="btn btn-primary" onclick="requestWithdrawal()">Submit Withdrawal Request</button>
    </div>

    <!-- Gift Code Card -->
    <div class="card">
        <h3><i class="fa-solid fa-gift" style="color: #f59e0b;"></i> Claim Gift Code</h3>
        <div class="form-group">
            <label>Enter Gift Code:</label>
            <input type="text" id="giftCodeBox" class="form-control" placeholder="BONUS100">
        </div>
        <button class="btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0b0f19;" onclick="claimGiftCode()">Claim Bonus</button>
    </div>
</div>

<div class="navbar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
    <a href="refer.html" class="nav-item"><i class="fa-solid fa-gift"></i> Refer & Earn</a>
    <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i> Account</a>
</div>

<script>
    const BIN_ID = "6a956b28f5f4af5e29579654";
    const API_KEY = "$2a$10$NlG72U8qTFJlqXuI46qkm.GIULbWkTOFL0QznU4GCT0ypt9I5Icy6";

    let balance = parseFloat(localStorage.getItem('skynova_balance') || '326.10');
    let uid = localStorage.getItem('skynova_uid') || '794973';
    document.getElementById('accountBalance').innerText = balance.toFixed(2);
    document.getElementById('displayUid').innerText = uid;

    async function requestDeposit() {
        let amount = parseFloat(document.getElementById('depAmount').value);
        let utr = document.getElementById('depUtr').value.trim();

        if(isNaN(amount) || amount <= 0 || !utr) {
            alert("Kripya sahi amount aur UTR dalein!");
            return;
        }

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;

            if(!data.deposits) data.deposits = [];
            data.deposits.push({ id: Date.now(), uid: uid, amount: amount, utr: utr, status: 'Pending' });

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });

            if(updateRes.ok) {
                alert("Deposit request admin ko bhej di gayi hai! Approval ke baad balance update ho jayega.");
                document.getElementById('depAmount').value = '';
                document.getElementById('depUtr').value = '';
            }
        } catch(e) {
            alert("Error sending deposit request.");
        }
    }

    async function requestWithdrawal() {
        let amount = parseFloat(document.getElementById('withAmount').value);
        let details = document.getElementById('withDetails').value.trim();

        if(isNaN(amount) || amount <= 0 || !details) {
            alert("Sahi amount aur details bharein!");
            return;
        }

        if(balance < amount) {
            alert("Aapka balance kam hai!");
            return;
        }

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;

            if(!data.withdrawals) data.withdrawals = [];
            data.withdrawals.push({ id: Date.now(), uid: uid, amount: amount, details: details, status: 'Pending' });

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });

            if(updateRes.ok) {
                balance -= amount;
                localStorage.setItem('skynova_balance', balance.toFixed(2));
                document.getElementById('accountBalance').innerText = balance.toFixed(2);

                alert("Withdrawal request submit ho gayi hai!");
                document.getElementById('withAmount').value = '';
                document.getElementById('withDetails').value = '';
            }
        } catch(e) {
            alert("Error sending withdrawal request.");
        }
    }

    async function claimGiftCode() {
        let code = document.getElementById('giftCodeBox').value.trim().toUpperCase();
        if(!code) { alert("Code dalein!"); return; }

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let data = json.record;

            if(!data.gifts || !data.gifts[code]) {
                alert("Galat ya expired gift code!");
                return;
            }

            let gift = data.gifts[code];
            if(!gift.claimedUsers) gift.claimedUsers = [];

            if(gift.claimedUsers.includes(uid)) {
                alert("Aap yeh code pehle hi claim kar chuke hain!");
                return;
            }

            if(gift.usedCount >= gift.maxUses) {
                alert("Is gift code ki limit khatam ho chuki hai!");
                return;
            }

            gift.claimedUsers.push(uid);
            gift.usedCount++;

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(data)
            });

            if(updateRes.ok) {
                balance += gift.amount;
                localStorage.setItem('skynova_balance', balance.toFixed(2));
                document.getElementById('accountBalance').innerText = balance.toFixed(2);
                alert(`Badhai ho! ₹${gift.amount} aapke account me add ho gaye hain.`);
                document.getElementById('giftCodeBox').value = '';
            }
        } catch(e) {
            alert("Error claiming gift code.");
        }
    }
</script>
</body>
</html>
