<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Home</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding-bottom: 60px;
        }
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-box img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
        }
        .logo-box span {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .wallet {
            background-color: #0f172a;
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid #38bdf8;
            font-size: 13px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 15px;
            text-align: center;
        }
        .banner-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .banner-card img {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .banner-card img:hover {
            transform: scale(1.02);
        }
        .play-now-btn {
            display: inline-block;
            margin-top: 15px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
        }
        .play-now-btn:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
        }
        
        /* Bottom Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 2px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }
        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <img src="logo.png" alt="Logo">
        <span>SkyNova</span>
    </div>
    <div class="wallet">Bal: ₹<span id="userBalance">69.00</span></div>
</header>

<div class="container">
    <div class="banner-card">
        <!-- Banner par click karne par game play page par chale jayega -->
        <a href="game.html">
            <img src="game-banner.png" alt="SkyNova Aviator Banner">
        </a>
        <a href="game.html" class="play-now-btn">🚀 PLAY NOW</a>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="navbar">
    <a href="home.html" class="nav-item active">🏠 Home</a>
    <a href="game.html" class="nav-item">🎮 Game</a>
    <a href="refer.html" class="nav-item">🎁 Refer & Earn</a>
    <a href="account.html" class="nav-item">👤 Account</a>
</div>

<script>
    // LocalStorage se real balance load karna taaki game aur account se match kare
    window.addEventListener('DOMContentLoaded', () => {
        let currentBal = parseFloat(localStorage.getItem('skynova_balance') || '69.00');
        document.getElementById('userBalance').innerText = currentBal.toFixed(2);
    });
</script>
</body>
</html>
