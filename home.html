<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Home</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 90px; }
        header { background-color: #161e2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f293d; }
        .brand { font-size: 18px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .container { max-width: 500px; margin: 15px auto; padding: 10px; }
        
        .wallet-banner { background: linear-gradient(135deg, #161e2e, #1e1b4b); border: 1px solid #334155; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .balance-title { font-size: 13px; color: #94a3b8; font-weight: bold; }
        .balance-amount { font-size: 32px; font-weight: bold; color: #4ade80; margin: 8px 0 15px 0; }
        .wallet-btns { display: flex; gap: 10px; }
        .wallet-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; text-decoration: none; text-align: center; }
        .btn-dep { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-with { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }

        .game-card { background: linear-gradient(135deg, #161e2e, #1e1b4b); border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .game-title { font-size: 20px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
        .game-desc { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
        .btn-play { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0b0f19; border: none; padding: 12px 30px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; text-transform: uppercase; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161e2e; display: flex; justify-content: space-around; padding: 14px 0; border-top: 2px solid #1f293d; z-index: 50; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: bold; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

<header>
    <div class="brand"><i class="fa-solid fa-rocket"></i> SkyNova</div>
    <div style="color: #94a3b8; font-size: 13px;">UID: <b style="color: #38bdf8;">794973</b></div>
</header>

<div class="container">
    <!-- Wallet Banner -->
    <div class="wallet-banner">
        <div class="balance-title">Total Available Balance</div>
        <div class="balance-amount">₹<span id="homeBalance">326.10</span></div>
        <div class="wallet-btns">
            <a href="account.html" class="wallet-btn btn-dep">Deposit</a>
            <a href="account.html" class="wallet-btn btn-with">Withdraw</a>
        </div>
    </div>

    <!-- Aviator Game Card -->
    <div class="game-card">
        <div class="game-title"><i class="fa-solid fa-plane-departure"></i> Aviator Flight Game</div>
        <div class="game-desc">Bet lagayein aur rocket ke sath fly karke cash out karein!</div>
        <a href="game.html" class="btn-play">Play Now</a>
    </div>

    <!-- Dragon vs Tiger Game Card (New) -->
    <div class="game-card">
        <div class="game-title"><i class="fa-solid fa-dragon" style="color: #f59e0b;"></i> Dragon vs Tiger</div>
        <div class="game-desc">Choose your side: Dragon or Tiger and win big!</div>
        <a href="dragon.html" class="btn-play" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0b0f19;">Play Now</a>
    </div>
</div>

<div class="navbar">
    <a href="home.html" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
    <a href="refer.html" class="nav-item"><i class="fa-solid fa-gift"></i> Refer & Earn</a>
    <a href="account.html" class="nav-item"><i class="fa-solid fa-user"></i> Account</a>
</div>

<script>
    let balance = parseFloat(localStorage.getItem('skynova_balance') || '326.10');
    document.getElementById('homeBalance').innerText = balance.toFixed(2);
</script>
</body>
</html>
