<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNova - Home</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding-bottom: 70px; }
        header { background-color: #161e2e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1f293d; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #38bdf8; }
        .header-left span { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .wallet-box { background-color: #0b0f19; padding: 6px 14px; border-radius: 20px; border: 1px solid #38bdf8; font-size: 14px; color: #38bdf8; font-weight: bold; }
        
        .container { max-width: 500px; margin: 20px auto; padding: 10px; text-align: center; }
        
        /* Banner Image Styling */
        .banner-img-box { width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.6); border: 1px solid #334155; margin-bottom: 20px; background-color: #161e2e; }
        .banner-img-box img { width: 100%; height: auto; display: block; }

        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161e2e; display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid #1f293d; z-index: 50; }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: bold; text-align: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo">
        <span>SkyNova</span>
    </div>
    <div class="wallet-box">Bal: ₹<span id="userBalance">69.00</span></div>
</header>

<div class="container">
    <!-- Clickable Banner & Play Button Image -->
    <div class="banner-img-box">
        <a href="game.html">
            <img src="game-banner.png" alt="SkyNova Aviator Banner">
        </a>
    </div>
</div>

<div class="navbar">
    <a href="home.html" class="nav-item active">🏠 Home</a>
    <a href="refer.html" class="nav-item">🎁 Refer & Earn</a>
    <a href="account.html" class="nav-item">👤 Account</a>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentBal = parseFloat(localStorage.getItem('skynova_balance') || '69.00');
        document.getElementById('userBalance').innerText = currentBal.toFixed(2);
    });
</script>
</body>
</html>
